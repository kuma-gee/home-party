name: Godot Build

on:
  workflow_call:
    inputs:
      channels:
        description: 'Channels to build'
        required: true
        type: string
      steam-app:
        description: 'Steam App ID'
        type: number
        default: 430
      godot-version:
        description: 'Godot version'
        type: string
        default: '4.3'
      project-path:
        description: 'Path to the project'
        type: string
        default: '.'
      assets-path:
        description: 'Path to the assets relative to the project'
        type: string
        default: 'assets'
      env-build-file:
        description: 'Path to the build env file relative to the project'
        type: string
        default: 'build.gd'
      use-password:
        description: 'Use password'
        type: boolean
        default: true
      template-repo:
        description: 'Template repository'
        type: string
        default: 'kuma-gee/action-godot-template'
      game-client-path:
        description: 'Path to the smartphone controller app'
        type: string
        default: 'game-client'

    secrets:
      ENCRYPTION_KEY:
        description: 'Encryption key'
        required: false
      GAME_CODE:
        description: 'Game code'
        required: false
      ASSETS_PASSWORD:
        description: 'Password for the assets'
        required: false
    
    outputs:
      game:
        description: 'Game name'
        value: ${{ jobs.build-game.outputs.game }}
      password:
        description: 'Generated password'
        value: ${{ jobs.generate-password.outputs.password }}

jobs:
  generate-password:
    runs-on: ubuntu-latest
    outputs:
      password: ${{ steps.random-password.outputs.password }}
    steps:
      - uses: kuma-gee/action-godot/password@main
        id: random-password
        with:
          length: ${{ inputs.use-password && 32 || 0 }}

  build-game-client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install game-client dependencies
        working-directory: ${{ inputs.game-client-path }}
        run: bun install --frozen-lockfile

      - name: Build game-client
        working-directory: ${{ inputs.game-client-path }}
        run: |
          mkdir -p ../build/web
          bun run build

      - name: Upload game-client build
        uses: actions/upload-artifact@v4
        with:
          name: game-client-web
          path: build/web
   
  build-game:
    runs-on: ubuntu-latest
    needs: [generate-password, build-game-client]
    container: barichello/godot-ci:${{ inputs.godot-version }}
    strategy:
      matrix:
        channel: ${{ fromJson(inputs.channels) }}
    outputs:
      game: ${{ steps.build.outputs.game }}
    steps:
      - uses: actions/checkout@v4
    
      - name: Unpack protected assets
        if: env.ASSETS_PASSWORD
        uses: kuma-gee/action-protect-assets@v1
        with:
          path: ${{ inputs.project-path }}/${{ inputs.assets-path }}
          password: ${{ secrets.ASSETS_PASSWORD }}
        env:
          ASSETS_PASSWORD: ${{ secrets.ASSETS_PASSWORD }}
      
      - name: Create Godot Environment File
        uses: kuma-gee/action-godot/godot-env@main
        with:
          output: ${{ inputs.project-path }}/${{ inputs.env-build-file }}
          code: ${{ secrets.GAME_CODE }}
          version: ${{ github.ref_name }}
          steam-app: ${{ inputs.steam-app }}

      - name: Setup Templates
        uses: kuma-gee/action-godot-template/setup@v1
        with:
          version: ${{ inputs.godot-version }}
          channel: ${{ matrix.channel }}
          encryption-key: ${{ secrets.ENCRYPTION_KEY }}
          game-folder: ${{ inputs.project-path }}
          repo: ${{ inputs.template-repo }}

      - name: Download game-client build
        uses: actions/download-artifact@v4
        with:
          name: game-client-web
          path: ${{ inputs.project-path }}/build/web

      - name: Build Godot
        id: build
        run: |
          set -eu

          mkdir -p "$OUTPUT/$CHANNEL"

          GAME="$(awk -F'\"' '/config\/name/ {print $2; exit}' "$FOLDER/project.godot")"
          echo "game=$GAME" >> "$GITHUB_OUTPUT"

          FILE="main"
          EXT=""
          if [ "$CHANNEL" = "web" ]; then
            FILE="index"
            EXT=".html"
          elif [ "$CHANNEL" = "linux" ]; then
            EXT=".x86_64"
          elif [ "$CHANNEL" = "windows" ]; then
            EXT=".exe"
          elif [ "$CHANNEL" = "mac" ]; then
            EXT=".zip"
          fi

          godot --headless --path "$FOLDER" --export-release "$CHANNEL" "$(pwd)/$OUTPUT/$CHANNEL/$FILE$EXT"

          mkdir -p "$OUTPUT/$CHANNEL/build"
          cp -R "$FOLDER/build/web" "$OUTPUT/$CHANNEL/build/web"
        env:
          CHANNEL: ${{ matrix.channel }}
          OUTPUT: build
          FOLDER: ${{ inputs.project-path }}

      - name: Set Windows icon
        if: ${{ matrix.channel == 'windows' }}
        run: |
          dpkg --add-architecture i386
          apt update
          apt install -y wine64 wine32

          wget https://github.com/electron/rcedit/releases/download/v2.0.0/rcedit-x64.exe
          mkdir -p wine-prefix
          export WINEPREFIX="$(pwd)/wine-prefix"
          wine ./rcedit-x64.exe "$OUTPUT/windows/main.exe" --set-icon "$FOLDER/icon.ico"
        env:
          OUTPUT: build
          FOLDER: ${{ inputs.project-path }}

      - name: Package build
        run: |
          set -eu

          ARCHIVE="$(pwd)/$OUTPUT/${GAME}-${CHANNEL}.zip"
          cd "$OUTPUT/$CHANNEL"

          if [ -z "$PASSWORD" ]; then
            zip -r "$ARCHIVE" .
          else
            zip -r "$ARCHIVE" -e -P "$PASSWORD" .
          fi
        env:
          CHANNEL: ${{ matrix.channel }}
          OUTPUT: build
          GAME: ${{ steps.build.outputs.game }}
          PASSWORD: ${{ needs.generate-password.outputs.password }}
       
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.channel }}
          path: build/*.zip
